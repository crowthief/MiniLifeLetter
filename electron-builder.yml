appId: com.minilifeletter.app
productName: MiniLifeLetter
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.png
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
npmRebuild: false
electronDist: node_modules/electron/dist
electronVersion: 45.4.1
